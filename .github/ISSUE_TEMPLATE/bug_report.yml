name: Bug report
description: Something in msi-core does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A question goes to [Q&A](https://github.com/jeanmarcos-dev/msi-core/discussions/categories/q-a), and a vulnerability is reported privately as the [security policy](https://github.com/jeanmarcos-dev/msi-core/security/policy) explains, never in an issue.
  - type: input
    id: msi-core-version
    attributes:
      label: msi-core version
      description: "`composer show jeanmarcos/msi-core` prints it."
      placeholder: "1.1.3"
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Magento Open Source or Mage-OS version
      placeholder: "Magento Open Source 2.4.9"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4"
    validations:
      required: true
  - type: input
    id: database-version
    attributes:
      label: Database and version
      placeholder: "MySQL 8.4"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a clean state, and include the sources, stocks and products involved.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Exceptions from `var/log/exception.log` or `var/log/system.log`, if any.
      render: text
