name: integration

on:
  pull_request:
    branches: ['main', 'next-release']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: ['main', 'next-release']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: integration (${{ matrix.database.name }}, group ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            slug: mysql-8.4
            image: mysql:8.4
            health: mysqladmin ping --host=127.0.0.1 --user=root --password=root
          - name: MariaDB 12.3
            slug: mariadb-12.3
            image: mariadb:12.3
            health: healthcheck.sh --connect --innodb_initialized
        group: [1, 2, 3, 4]
        include:
          - group: 1
            modules: >-
              InventoryCatalog
              InventoryShipping
              InventoryBundleProduct
              InventorySalesAdminUi
              InventorySourceSelectionApi
              InventoryInStorePickupQuote
              InventoryCatalogRule
              InventorySetupFixtureGenerator
          - group: 2
            modules: >-
              InventorySales
              InventoryGroupedProductIndexer
              InventoryReservationCli
              InventoryVisualMerchandiser
              InventoryShippingAdminUi
              InventoryAdminUi
              InventoryCatalogAdminUi
              InventoryConfiguration
              InventoryAdjustmentAdminUi
          - group: 3
            modules: >-
              InventoryConfigurableProduct
              InventoryProductAlert
              InventoryBundleProductIndexer
              InventoryConfigurableProductIndexer
              InventoryInStorePickupShipping
              InventoryStockVisualizer
              Inventory
              InventoryCatalogFrontendUi
              InventoryLowQuantityNotificationAdminUi
          - group: 4
            modules: >-
              InventoryInStorePickupSales
              InventoryIndexer
              InventoryInStorePickup
              InventoryCatalogSearch
              InventoryLowQuantityNotification
              InventoryImportExport
              InventoryGroupedProduct
              InventoryCatalogSearchBundleProduct
              InventoryInStorePickupMultishipping
              InventoryElasticsearch
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: magento_integration_tests
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: magento_integration_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      opensearch:
        image: opensearchproject/opensearch:3
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          cluster.max_shards_per_node: '10000'
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: magento_integration_tests
      OPENSEARCH_HOST: 127.0.0.1
      OPENSEARCH_PORT: '9200'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, gd, iconv, intl, mbstring, pdo_mysql, simplexml, soap, sockets, sodium, xsl, zip

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-magento-8.5-${{ hashFiles('composer.json') }}
          restore-keys: composer-magento-8.5-

      - name: Install magento with msi-core
        run: sh .github/scripts/ci-magento-project.sh magento "$RUNNER_TEMP/magento"

      - name: Let MySQL create the triggers msi-core installs
        if: matrix.database.slug == 'mysql-8.4'
        run: mysql --host=127.0.0.1 --user=root --password=root --execute='SET GLOBAL log_bin_trust_function_creators = 1'

      - name: Install the MariaDB 12.3 client
        if: matrix.database.slug == 'mariadb-12.3'
        run: |
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSL --retry 5 https://mariadb.org/mariadb_release_signing_key.asc -o /etc/apt/keyrings/mariadb-keyring.asc
          echo 'deb [signed-by=/etc/apt/keyrings/mariadb-keyring.asc] https://archive.mariadb.org/mariadb-12.3.3/repo/ubuntu noble main' | sudo tee /etc/apt/sources.list.d/mariadb.list
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get purge -y 'mysql-server*' 'mysql-client*' mysql-common
          sudo apt-get -o Acquire::Retries=5 install -y mariadb-client
          mariadb-dump --version

      - name: Accept the mail the tests send
        run: |
          printf '#!/bin/sh\ncat > /dev/null\n' | sudo tee /usr/sbin/sendmail > /dev/null
          sudo chmod +x /usr/sbin/sendmail

      - name: Integration tests, one phpunit run per module
        env:
          MODULES: ${{ matrix.modules }}
        run: printf '%s\n' "$MODULES" | xargs sh .github/scripts/ci-integration-modules.sh "$RUNNER_TEMP/magento" "$RUNNER_TEMP/integration-reports"

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-junit-${{ matrix.database.slug }}-group-${{ matrix.group }}
          path: ${{ runner.temp }}/integration-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Magento logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ matrix.database.slug }}-group-${{ matrix.group }}
          path: ${{ runner.temp }}/magento/dev/tests/integration/tmp/sandbox-*/var/log
          if-no-files-found: ignore
          retention-days: 14
