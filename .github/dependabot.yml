version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: next-release
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs
    target-branch: next-release
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      docs:
        patterns:
          - "*"
